# Self-hosted infrastructure for AgentFlow.
#
#   docker compose up -d          # Postgres + RustFS (S3) + Mailpit + Local Git
#   pnpm storage:init             # create the buckets (idempotent)
#   pnpm local-git:init           # Local Git admin + token for its connection
#
# Values below are development defaults. Override any of them in a `.env` file
# next to this compose file (see .env.docker.example).

name: agentflow

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-agentflow_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentflow_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage (attachments, transcripts, loop state,
  # catalog assets). Apache-2.0. Console at http://localhost:9001.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-agentflow}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-agentflow-dev-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-warn}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches outgoing mail (invitations, password resets) in development.
  # Web UI at http://localhost:8025, SMTP on localhost:1025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Local Git: git hosting on this machine for projects without a remote
  # (Gitea, MIT). Web UI to browse code, commits and branches, review and
  # merge pull requests, download archives; git over HTTP for agents.
  # http://localhost:3300 — `pnpm local-git:init` creates the admin account and
  # the token of the "Local Git" connection (docs/local-git.md).
  local-git:
    image: gitea/gitea:1.24.7
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${LOCAL_GIT_URL:-http://localhost:3300}/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__log__LEVEL: warn
    ports:
      - "${LOCAL_GIT_PORT:-3300}:3000"
    volumes:
      - local_git_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rustfs_data:
  local_git_data:

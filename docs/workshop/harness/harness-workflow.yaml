name: React Calculator PRDs (Harness)
description: >-
  A PRD posted to this workflow's HTTP endpoint goes through the Harness
  process of the project (plan with the generated agent team, approval,
  build); each repository the run changed gets a Local Git pull request.
project: React Calculator (Harness)
triggers:
  - connection: http            # the workflow's own URL ("Show URL and secret")
    type: webhook.request
    config:
      types: [prd]              # only requests with "type": "prd" start a run
agent:
  runAs: admin@agentflow.local
  runner: runner-1
  prd:
    instruction: PRD when the request type is prd.
actions:
  - on: execute.completed       # the build step pushed its branches
    type: local_git.create_pull_request   # one PR per pushed repository (code + run notes)
    config:
      title: "{{source.key}}: {{source.title}}"
      description: |-
        {{source.key}}: {{source.title}}, delivered with the agent team generated by revfactory/harness.

        PRD: {{feature.url}}
        Implementation plan: {{plan.url}}
        Release notes: {{releaseNotes.url}}
        AgentFlow run: {{run.url}}
      draft: false
